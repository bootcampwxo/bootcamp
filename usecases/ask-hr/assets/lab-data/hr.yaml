openapi: 3.0.0
info:
  title: Automação de RH
  description: API para consultar dados de funcionários e atualizar informações de perfil
  version: 1.0.0
servers:
- url: https://hr-skills.2gu5j6t579g6.ca-tor.codeengine.appdomain.cloud
  description: Servidor de producao
tags: []
paths:
  "/user_profile_details/{name}":
    get:
      operationId: obter_perfil_usuario
      summary: Obter perfil do usuário
      description: |2-

        Obtém os dados completos do perfil do usuário.

        :param name: Nome do usuário
        :returns: Dados do perfil do usuário, incluindo endereço, ID, nome, saldo de folgas e cargo.

      parameters:
      - name: name
        in: path
        description: Nome do usuário (identificador único).
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  title:
                    type: string
                  address:
                    type: string
                  time_off_balance:
                    type: integer
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
  "/time-off-balance/{name}":
    get:
      operationId: obter_saldo_folgas
      summary: Obter saldo de folgas
      description: |
        Obtém o saldo de folgas do usuário.

        :param name: Nome do usuário
        :returns: Saldo de folgas do usuário em uma única string

      parameters:
      - name: name
        in: path
        description: Nome do usuário.
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                description: Saldo de folgas restante em uma única string.
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
  "/request-time-off":
    post:
      operationId: solicitar_folga
      summary: Solicitar folga
      description: |2-

        Solicita folga / registra um pedido de ausência.

        :param name: Nome do usuário
        :param from_date: Data de início da folga, no formato AAAA-MM-DD (ex.: 2025-05-22)
        :param to_date: Data de término da folga, no formato AAAA-MM-DD (ex.: 2025-05-27)
        :returns: Mensagem de confirmação

      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de confirmação em uma única string.
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimeOffRequest"
  "/update-title":
    put:
      operationId: atualizar_cargo
      summary: Atualizar cargo
      description: |

        Atualiza o cargo do usuário.

        :param name: Nome do usuário
        :param new_title: Novo cargo do usuário
        :returns: Mensagem de confirmação em uma única string

      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de confirmação em uma única string.
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateTitleRequest"
  "/update-address":
    put:
      operationId: atualizar_endereco
      summary: Atualizar endereço
      description: |2-

        Atualiza o endereço do usuário.

        :param name: Nome do usuário
        :param new_address: Novo endereço do usuário
        :returns: Mensagem de confirmação

      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de confirmação em uma única string.
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateAddressRequest"
  "/create-user":
    post:
      operationId: criar_usuario
      summary: Criar usuário
      description: |2-

        Cria um novo usuário no sistema de RH (uso administrativo).

        :param name: Nome completo do usuário
        :param time_off_balance: Saldo inicial de folgas, em dias
        :param title: Cargo do usuário
        :param address: Endereço do usuário
        :returns: Mensagem de confirmação com o ID do usuário

      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de confirmação com o ID do usuário em uma única string.
          description: Resposta com sucesso
        '422':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
          description: Erro de validação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateUserRequest"
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome completo do usuário.
        time_off_balance:
          type: integer
          description: Saldo inicial de folgas, em dias.
        title:
          type: string
          description: Cargo do usuário.
        address:
          type: string
          description: Endereço do usuário.
      required:
      - name
      - time_off_balance
      - title
      - address
      title: CreateUserRequest
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationError"
          description: Lista de erros de validação.
          title: Detail
      title: HTTPValidationError
    TimeOffRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuário.
        from_date:
          type: string
          description: Data de início da folga (AAAA-MM-DD).
          format: date
        to_date:
          type: string
          description: Data de término da folga (AAAA-MM-DD).
          format: date
      required:
      - name
      - from_date
      - to_date
      title: TimeOffRequest
    UpdateAddressRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuário.
        new_address:
          type: string
          description: Novo endereço do usuário.
      required:
      - name
      - new_address
      title: UpdateAddressRequest
    UpdateTitleRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuário.
        new_title:
          type: string
          description: Novo cargo do usuário.
      required:
      - name
      - new_title
      title: UpdateTitleRequest
    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
          description: Localização do erro na requisição.
        msg:
          type: string
          description: Mensagem descrevendo o erro.
        type:
          type: string
          description: Tipo do erro.
      required:
      - loc
      - msg
      - type
      title: ValidationError
