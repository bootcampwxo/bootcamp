paths:
  /catalogItems:
    post:
      summary: Search Catalog Items
      description: ''
      operationId: postCatalogItems
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCatalogPayload'
              type: object
              properties:
                search_term:
                  type: string
                  title: Search Term
                  description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tes2'
      x-ibm-operation:
        action: create
        model: Testing
      x-ibm-mandatory:
        - search_term
      tags:
        - Testing
      x-ibm-important:
        - search_term
      x-ibm-order: []
  /supplier:
    post:
      description: ''
      summary: Search Suppliers For Item
      operationId: postSupplier
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppliersPayload'
              type: object
              properties:
                item_id:
                  type: string
                  title: Item ID
                  description: ''
      x-ibm-important:
        - item_id
      x-ibm-order: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sresponse'
                type: object
                properties:
                  success:
                    type: boolean
                    title: Success
                  message:
                    type: string
                    title: Message
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        company_code:
                          type: string
                          title: Company Code
                          description: ''
                        created_by:
                          type: string
                          title: Created By
                          description: ''
                        creation_date:
                          type: string
                          title: Creation Date
                          description: ''
                        supplier_company_name:
                          type: string
                          title: Supplier Company Name
                          description: ''
                        supplier_id:
                          type: string
                          title: Supplier ID
                          description: ''
                        supplier_name:
                          type: string
                          title: Supplier Name
                          description: ''
                    title: Content
      x-ibm-operation:
        action: create
        model: Testing
      x-ibm-mandatory:
        - item_id
      tags:
        - Testing
  /purchaseRequisition:
    post:
      description: ''
      summary: Search Requisitions
      operationId: postPurchaseRequisition
      parameters: []
