        - created_date
        - item
        - status
      x-ibm-order: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRSResponse'
      x-ibm-operation:
        action: create
        model: Testing
      x-ibm-mandatory: []
      tags:
        - Testing
  /createPR:
